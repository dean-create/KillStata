name: typecheck

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run typecheck
        run: |
          bun run --cwd packages/killstata typecheck
          bun run --cwd packages/script typecheck
          bun run --cwd packages/sdk/js typecheck
          bun run --cwd packages/util typecheck
          bun run --cwd desktop typecheck
