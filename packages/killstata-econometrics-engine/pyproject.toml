[project]
name = "killstata-econometrics-engine"
version = "0.2.0"
description = "Standalone Python engine for KillStata econometric methods"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.13.2",
  "pandas==3.0.5",
  "numpy==2.5.3",
  "scipy==1.18.1",
  "statsmodels==0.15.0",
  "linearmodels==7.0",
  "pyfixest==0.60.0",
  "rdrobust==2.0.0",
  "matplotlib==3.11.1",
  "scikit-learn==1.9.0",
  "pyarrow==25.0.1",
  "openpyxl==3.1.5",
  "python-docx==1.2.0",
]

[tool.killstata]
protocol-version = 2
registry-version = 2
