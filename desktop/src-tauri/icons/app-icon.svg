<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#26302e"/>
      <stop offset="100%" stop-color="#1b2221"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f4f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <!-- 外层圆角背景，改成更柔和的深青灰渐变，不再是纯黑 -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- 内层卡片：略缩小，给四周更多留白，解决“有点大”的感觉 -->
  <g filter="url(#shadow)">
    <rect x="136" y="138" width="240" height="236" rx="28" fill="url(#card)" stroke="#e2e8de" stroke-width="3"/>
  </g>
  <!-- 柱状图：四根柱子等距，高度微调，更克制 -->
  <g stroke-linecap="round">
    <path d="M174 314V205" stroke="#a8bf9e" stroke-width="26"/>
    <path d="M230 314V222" stroke="#8fae85" stroke-width="26"/>
    <path d="M286 314V174" stroke="#7a9e72" stroke-width="26"/>
    <path d="M342 314V210" stroke="#9ab892" stroke-width="26"/>
  </g>
  <!-- 折线：更细，带微小圆点 -->
  <path d="M162 176L230 212L286 166L350 196" fill="none" stroke="#2f3a37" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.92"/>
  <circle cx="162" cy="176" r="9" fill="#2f3a37" stroke="white" stroke-width="3"/>
  <circle cx="230" cy="212" r="9" fill="#2f3a37" stroke="white" stroke-width="3"/>
  <circle cx="286" cy="166" r="9" fill="#2f3a37" stroke="white" stroke-width="3"/>
  <circle cx="350" cy="196" r="9" fill="#2f3a37" stroke="white" stroke-width="3"/>
</svg>
